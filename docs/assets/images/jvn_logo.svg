<svg xmlns="http://www.w3.org/2000/svg" width="380" height="190" viewBox="0 0 380 190" role="img" aria-labelledby="title desc">
  <title id="title">JVN logo</title>
  <desc id="desc">A background-free metallic JVN wordmark with a restrained orange brush swipe behind it.</desc>
  <defs>
    <linearGradient id="brushOrange" x1="24" y1="152" x2="340" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.08"/>
      <stop offset="0.16" stop-color="#ff8f24" stop-opacity="0.52"/>
      <stop offset="0.54" stop-color="#f26a21" stop-opacity="0.82"/>
      <stop offset="0.82" stop-color="#ffb347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="brushSoftness" x="-8%" y="-35%" width="116%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.55" result="softAlpha"/>
      <feOffset in="softAlpha" dx="0" dy="2" result="offsetAlpha"/>
      <feMerge>
        <feMergeNode in="offsetAlpha"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#cfd8df"/>
      <stop offset="0.27" stop-color="#7c8791"/>
      <stop offset="0.42" stop-color="#f9fbfc"/>
      <stop offset="0.58" stop-color="#9da8b2"/>
      <stop offset="0.76" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#59636d"/>
    </linearGradient>
    <filter id="wordmarkShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="shadowBlur"/>
      <feOffset in="shadowBlur" dx="0" dy="10" result="shadowOffset"/>
      <feFlood flood-color="#000000" flood-opacity="0.34" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="highlightBlur"/>
      <feOffset in="highlightBlur" dx="0" dy="1" result="highlightOffset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.22" result="highlightColor"/>
      <feComposite in="highlightColor" in2="highlightOffset" operator="in" result="highlight"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="highlight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#brushSoftness)" opacity="0.92">
    <path d="M 28 150 C 92 124, 180 130, 336 94"
          fill="none"
          stroke="url(#brushOrange)"
          stroke-width="28"
          stroke-linecap="round"/>
    <path d="M 66 161 C 132 142, 211 143, 308 121"
          fill="none"
          stroke="#ffb347"
          stroke-opacity="0.22"
          stroke-width="5"
          stroke-linecap="round"/>
    <path d="M 47 132 C 125 111, 212 111, 356 77"
          fill="none"
          stroke="#f36b21"
          stroke-opacity="0.16"
          stroke-width="8"
          stroke-linecap="round"/>
  </g>

  <g filter="url(#wordmarkShadow)">
    <text x="8" y="136"
          font-family="Inter, 'ui-sans-serif', 'system-ui', '-apple-system', BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="154"
          font-weight="900"
          letter-spacing="6"
          fill="url(#metal)">JVN</text>
  </g>
</svg>
