name: Engine Hub release
on:
  push:
    branches: ['**']
    tags: ['engine-v*']
    paths:
      - '.github/workflows/engine-release.yml'
      - 'gradle.properties'
      - 'scripts/package-native-hub.py'
      - 'scripts/ship-engine.py'
      - 'scripts/windows-hub.iss'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            number="${GITHUB_REF_NAME#engine-v}"
          else
            number="$(sed -n 's/^jvnVersion=//p' gradle.properties)"
          fi
          [[ "$number" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF_TYPE" = branch && "$GITHUB_REF_NAME" = release/engine-v* ]]; then
            [[ "$number" = "${GITHUB_REF_NAME#release/engine-v}" ]] || { echo "Release branch and jvnVersion must match"; exit 1; }
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Hub and assemble engine workspace
        shell: bash
        run: ./gradlew :hub:test :hub:packageEngineHubLiteJar "-PjvnVersion=$VERSION" --no-daemon
      - name: Build and test the Editor extracted by the release Hub
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export JVN_TUTORIAL_QA_DIR="$RUNNER_TEMP/jvn-tutorial-preview"
          export JVN_PACKAGED_ENGINE_ROOT="$RUNNER_TEMP/jvn-release-workspace"
          engine="$(java -jar "build/distributions/jvn-engine-hub-lite-$VERSION.jar" --extract-only | tail -n 1)"
          cd "$engine"
          xvfb-run -a ./gradlew :branding:test :editor:test \
            --tests com.jvn.editor.AppBuildInfoTest \
            --tests com.jvn.editor.ui.RunWorkspaceTest \
            --tests com.jvn.editor.ui.RunConsoleViewLogFormatTest \
            --tests com.jvn.editor.ui.RunConsoleViewMigrationContractTest \
            --tests com.jvn.editor.ui.RuntimeAttributionTest \
            --tests com.jvn.editor.ui.WhatsNewCatalogTest \
            --tests com.jvn.editor.ui.GuidedTutorialIntegrationTest \
            --tests com.jvn.editor.ui.NewProjectScaffoldTemplateWiringTest \
            --tests com.jvn.editor.ui.GameBuildPublisherViewTest \
            --tests com.jvn.editor.ui.GameBuildPublisherViewFxTest --no-daemon
          unzip -q "$JVN_TUTORIAL_QA_DIR/Ginger-Tutorial.zip" -d "$RUNNER_TEMP/tutorial-routing"
          export JVN_GENERATED_TUTORIAL="$RUNNER_TEMP/tutorial-routing/GingerTutorial"
          ./gradlew :runtime:test --tests com.jvn.runtime.TutorialChoiceRoutingTest --no-daemon
      - name: Report failing packaged tests
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          for path in glob.glob(os.environ["RUNNER_TEMP"] + "/jvn-release-workspace/**/TEST-*.xml", recursive=True):
              for case in ET.parse(path).iter("testcase"):
                  for failure in case.findall("failure"):
                      print(case.get("classname"), case.get("name"), failure.get("message"))
          PY
      - name: Build packages and test the installed Hub
        shell: bash
        run: python scripts/package-native-hub.py "$VERSION" "build/distributions/jvn-engine-hub-lite-$VERSION.jar" build/native-hub --test-install
      - name: Include the wizard-generated tutorial and menu preview
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp "$RUNNER_TEMP/jvn-tutorial-preview/Ginger-Tutorial.zip" "$RUNNER_TEMP/jvn-tutorial-preview/Ginger-menus.png" build/native-hub/
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.runner }}
          path: build/native-hub/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/engine-v') || startsWith(github.ref, 'refs/heads/release/engine-v')
    needs: [version, package]
    runs-on: ubuntu-latest
    concurrency: engine-release-${{ needs.version.outputs.number }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: engine-v${{ needs.version.outputs.number }}
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-*
          path: release
          merge-multiple: true
      - name: Verify and publish
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          for target in windows-x64.exe macos-arm64.dmg linux-x64.tar.gz windows-x64.zip macos-arm64.tar.gz; do
            file="jvn-engine-hub-$VERSION-$target"
            test -s "$file"
            sha256sum --check --strict "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          for file in Ginger-Tutorial.zip Ginger-menus.png; do
            test -s "$file"
            assets+=("$file")
          done
          if [[ "$GITHUB_REF_TYPE" = branch ]]; then
            if ! gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent; then
              [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$GITHUB_SHA" ]] || exit 1
            fi
          fi
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$state" = true ]] || { echo "This release is already published."; exit 0; }
          else
            notes=(--generate-notes)
            notes_file="../docs/project-setup/release/whats-new-$VERSION.md"
            if [[ -s "$notes_file" ]]; then notes=(--notes-file "$notes_file"); fi
            gh release create "$TAG" --verify-tag --draft --title "JVN $VERSION" "${notes[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          preview=false
          if [[ "$VERSION" == 0.* ]]; then preview=true; fi
          gh release edit "$TAG" --prerelease="$preview" --draft=false
