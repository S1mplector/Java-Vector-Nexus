name: Engine Hub release
on:
  push:
    branches: ['**']
    tags: ['engine-v*']
    paths:
      - '.github/workflows/engine-release.yml'
      - 'scripts/package-native-hub.py'
      - 'scripts/ship-engine.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            number="${GITHUB_REF_NAME#engine-v}"
          else
            number="$(sed -n 's/^jvnVersion=//p' gradle.properties)"
          fi
          [[ "$number" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "number=$number" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Hub and assemble engine workspace
        shell: bash
        run: ./gradlew :hub:test :hub:packageEngineHubLiteJar "-PjvnVersion=$VERSION" --no-daemon
      - name: Build and smoke-test native app
        shell: bash
        run: python scripts/package-native-hub.py "$VERSION" "build/distributions/jvn-engine-hub-lite-$VERSION.jar" build/native-hub
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.runner }}
          path: build/native-hub/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: [version, package]
    runs-on: ubuntu-latest
    concurrency: engine-release-${{ github.ref }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-*
          path: release
          merge-multiple: true
      - name: Verify and publish
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          for target in windows-x64.zip macos-arm64.tar.gz linux-x64.tar.gz; do
            sha256sum --check "jvn-engine-hub-$VERSION-$target.sha256"
          done
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$state" = true ]] || { echo "This release is already published."; exit 0; }
          else
            gh release create "$TAG" --verify-tag --draft --title "JVN Engine Hub $VERSION" --generate-notes
          fi
          gh release upload "$TAG" ./* --clobber
          gh release edit "$TAG" --draft=false
