name: Verify published Engine Hub installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published engine release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }} downloads
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, verify and launch the released packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JVN_TAG: ${{ inputs.tag }}
          JVN_PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$JVN_TAG" =~ ^engine-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          downloads="$RUNNER_TEMP/jvn-downloads"
          gh release download "$JVN_TAG" --dir "$downloads" \
            --pattern "jvn-engine-hub-${JVN_TAG#engine-v}-$JVN_PLATFORM.*"
          python - "$downloads" <<'PY'
          import hashlib
          import os
          import runpy
          import shutil
          import sys
          import tempfile
          from pathlib import Path

          helpers = runpy.run_path("scripts/package-native-hub.py")
          platform = os.environ["JVN_PLATFORM"]
          version = os.environ["JVN_TAG"].removeprefix("engine-v")
          downloads = Path(sys.argv[1])
          suffixes, launcher = {
              "windows-x64": ((".exe", ".zip"), "JVN Engine Hub/JVN Engine Hub.exe"),
              "macos-arm64": ((".dmg", ".tar.gz"), "JVN Engine Hub.app/Contents/MacOS/JVN Engine Hub"),
              "linux-x64": ((".tar.gz",), "JVN Engine Hub/bin/JVN Engine Hub"),
          }[platform]
          deb = downloads / f"jvn-engine-hub-{version}-linux-x64.deb"
          if platform == "linux-x64" and deb.is_file():
              suffixes = (*suffixes, ".deb")
          for suffix in suffixes:
              artifact = downloads / f"jvn-engine-hub-{version}-{platform}{suffix}"
              checksum = artifact.with_name(artifact.name + ".sha256")
              expected = checksum.read_text(encoding="ascii").split()[0]
              with artifact.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA-256 mismatch for {artifact.name}")
              print(f"Verified SHA-256 for {artifact.name}", flush=True)
              with tempfile.TemporaryDirectory(prefix="jvn-release-check-") as directory:
                  work = Path(directory)
                  if suffix in (".exe", ".dmg"):
                      if suffix == ".dmg":
                          helpers["run"]("hdiutil", "verify", artifact)
                      helpers["smoke_installer"](artifact, work)
                  elif suffix == ".deb":
                      extracted = work / "extracted"
                      helpers["run"]("dpkg-deb", "--extract", artifact, extracted)
                      helpers["smoke_launcher"](extracted / "opt/jvn-engine-hub/bin/JVN Engine Hub", work / "workspace")
                  else:
                      extracted = work / "extracted"
                      if suffix == ".tar.gz":
                          shutil.unpack_archive(artifact, extracted, filter="data")
                      else:
                          shutil.unpack_archive(artifact, extracted)
                      helpers["smoke_launcher"](extracted / launcher, work / "workspace")
              print(f"Launched {artifact.name} and checked the extracted engine", flush=True)
          PY
