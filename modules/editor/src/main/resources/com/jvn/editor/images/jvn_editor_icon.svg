<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">JVN Editor</title>
  <desc id="desc">An extruded silver JVN monogram and amber stroke over two angled sapphire glass plates.</desc>
  <defs>
    <linearGradient id="rearGlass" x1=".14" y1="0" x2=".8" y2="1">
      <stop stop-color="#d1f7ff"/>
      <stop offset=".3" stop-color="#54c2e9"/>
      <stop offset=".73" stop-color="#236799"/>
      <stop offset="1" stop-color="#102e50"/>
    </linearGradient>
    <linearGradient id="cutEdge" x1=".05" y1="0" x2=".8" y2="1">
      <stop stop-color="#b4edff"/>
      <stop offset=".42" stop-color="#327fae"/>
      <stop offset=".74" stop-color="#174571"/>
      <stop offset="1" stop-color="#112b49"/>
    </linearGradient>
    <linearGradient id="face" x1=".09" y1="0" x2=".82" y2="1">
      <stop stop-color="#438fc8"/>
      <stop offset=".42" stop-color="#235f92"/>
      <stop offset=".66" stop-color="#163d65"/>
      <stop offset="1" stop-color="#152947"/>
    </linearGradient>
    <linearGradient id="reflection" x1=".12" y1="0" x2=".58" y2="1">
      <stop stop-color="#e6fcff" stop-opacity=".57"/>
      <stop offset=".57" stop-color="#6fe3ff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#97efff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1=".05" y1=".05" x2=".95" y2=".65">
      <stop stop-color="#f0fcff"/>
      <stop offset=".6" stop-color="#a8efff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a8efff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="amber" x1="14" y1="89" x2="111" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a94a16"/>
      <stop offset=".29" stop-color="#ef801e"/>
      <stop offset=".68" stop-color="#ffb32f"/>
      <stop offset="1" stop-color="#fff0af"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".42" stop-color="#e9f8ff"/>
      <stop offset=".49" stop-color="#bfd8e9"/>
      <stop offset=".77" stop-color="#a3c1d7"/>
      <stop offset="1" stop-color="#d3edfb"/>
    </linearGradient>
    <filter id="shadow" x="-.20" y="-1" width="1.4" height="3">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <path id="jvn" d="M18 0h9v19c0 8-4 12-12 12H9c-6 0-9-4-9-10v-3h9v3c0 2 1 3 3 3h2c3 0 4-1 4-5Zm12 0h9l8.6 20L56 0h9L52 31h-9Zm39 0h8l15 18V0h8v31h-8L77 13v18h-8Z"/>
  </defs>

  <ellipse cx="65" cy="110" rx="43" ry="5" fill="#07152a" opacity=".42" filter="url(#shadow)"/>
  <!-- Rear plate catches the light above the face and along its right edge. -->
  <path d="m24 31 75-21 7 3 15 67-4 7-78 22-8-4-15-66z"
        fill="url(#rearGlass)" stroke="#1b496e" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m24 33 75-21 5 3 14 63M35 103l79-22"
        fill="none" stroke="url(#edgeLight)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Split planes keep the body dimensional without framing the mark. -->
  <path d="m13 40 76-21 7 3 15 64-5 9-75 23-10-4L6 49z"
        fill="url(#cutEdge)" stroke="#132c49" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="m13 40 76-21 7 3 15 64-78 24-9-3L9 46z"
        fill="url(#face)" stroke="#225581" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="m14 41 75-21 5 3 7 28C73 46 39 55 17 69l-6-23z" fill="url(#reflection)"/>
  <path d="m12 46 3-4 74-21 5 2M26 106l7 2 76-23"
        fill="none" stroke="url(#edgeLight)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m33 110-2 8 75-23 5-9z" fill="#0c2038" opacity=".22"/>

  <!-- The sweeping amber stroke is carried over from the JVN identity. -->
  <path d="M11 91c22-21 56-23 98-39l10 1c-41 21-76 25-107 44z"
        fill="#1a2032" opacity=".55"/>
  <path d="M10 89c22-21 57-23 99-39l10 1C78 72 43 76 11 95z" fill="url(#amber)"/>
  <path d="M15 87c25-17 59-22 88-34" fill="none" stroke="#fff0b3" stroke-width=".95" stroke-opacity=".66"/>

  <g transform="translate(21 46) scale(.84)">
    <use xlink:href="#jvn" y="3.7" fill="#0b2137" stroke="#0b2137" stroke-width="1.7" opacity=".8"/>
    <use xlink:href="#jvn" y="1.5" fill="#547691"/>
    <use xlink:href="#jvn" fill="url(#silver)" stroke="#eafaff" stroke-width=".6" stroke-linejoin="round"/>
  </g>
</svg>
