<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">JVN Editor</title>
  <desc id="desc">A sapphire storyboard in a silver frame, signed with an amber lacquer pen and a split gold nib.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#fff"/><stop offset=".29" stop-color="#d2e7f1"/><stop offset=".50" stop-color="#94acbf"/>
      <stop offset=".56" stop-color="#607b91"/><stop offset=".83" stop-color="#dfeef3"/><stop offset="1" stop-color="#95aabd"/>
    </linearGradient>
    <linearGradient id="panel" x1=".08" y1="0" x2=".82" y2="1">
      <stop stop-color="#549cda"/><stop offset=".35" stop-color="#286faa"/><stop offset=".76" stop-color="#1c4679"/><stop offset="1" stop-color="#122c52"/>
    </linearGradient>
    <linearGradient id="glass" x1=".18" y1="0" x2=".65" y2="1">
      <stop stop-color="#fff" stop-opacity=".61"/><stop offset=".55" stop-color="#a4dcff" stop-opacity=".27"/><stop offset="1" stop-color="#bdeaff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#863e13"/><stop offset=".21" stop-color="#e8881e"/><stop offset=".41" stop-color="#ffe6a0"/>
      <stop offset=".51" stop-color="#ffc55d"/><stop offset=".79" stop-color="#df7e20"/><stop offset="1" stop-color="#99511c"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2=".92" y2=".45">
      <stop stop-color="#ab671c"/><stop offset=".22" stop-color="#ffdc84"/><stop offset=".49" stop-color="#fff3c2"/>
      <stop offset=".57" stop-color="#eab653"/><stop offset="1" stop-color="#ae6c22"/>
    </linearGradient>
    <radialGradient id="shadow"><stop stop-color="#101b2b" stop-opacity=".4"/><stop offset="1" stop-color="#101b2b" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="61" cy="115" rx="51" ry="8" fill="url(#shadow)"/>
  <!-- A thumb-width frame and a second card behind it read as a storyboard. -->
  <g transform="rotate(-7 60 65)">
    <rect x="21" y="16" width="82" height="85" rx="6" fill="#658196" stroke="#2f4a61" stroke-width="1.7"/>
    <rect x="21" y="13.5" width="82" height="84" rx="6" fill="url(#frame)" stroke="#667f93" stroke-width="1.3"/>
    <rect x="11" y="23" width="85" height="85" rx="6" fill="#3c556d" stroke="#263f58" stroke-width="1.5"/>
    <rect x="11" y="20" width="85" height="85" rx="6" fill="url(#frame)" stroke="#617d94" stroke-width="1.3"/>
    <rect x="16.5" y="25.5" width="74" height="67" rx="2.5" fill="url(#panel)" stroke="#294862" stroke-width="1.4"/>
    <path d="M18 28h70v12C63 39 43 44 18 60Z" fill="url(#glass)"/>
    <path d="M19 27h68" fill="none" stroke="#deefff" stroke-width="1.1" stroke-linecap="round"/>
    <!-- The original JVN letterforms are paths so every platform draws the same mark. -->
    <g transform="translate(21 46) scale(.59)" fill="#eef8ff" stroke="#16476e" stroke-width="1.6" paint-order="stroke">
      <path d="M18 0h9v19c0 8-4 12-12 12H9c-6 0-9-4-9-10v-3h9v3c0 2 1 3 3 3h2c3 0 4-1 4-5Zm12 0h9l8.6 20L56 0h9L52 31h-9Zm39 0h8l15 18V0h8v31h-8L77 13v18h-8Z"/>
    </g>
    <path d="M22 80c6-3 13-4 18-3s8 4 15 1" fill="none" stroke="#a5d9f5" stroke-width="2" stroke-linecap="round"/>
    <g fill="#59738a"><circle cx="20" cy="98.6" r="1.3"/><circle cx="25" cy="98.6" r="1.3"/><circle cx="30" cy="98.6" r="1.3"/></g>
  </g>
  <!-- The diagonal pen overlaps the card edge, giving the Editor its own silhouette. -->
  <g transform="translate(88.5 59) rotate(38)" stroke-linejoin="round">
    <path d="M-6-43q0-6 6-6t6 6l1 55-3 18-4 27-10-25 4-16Z" fill="#18283a" opacity=".3" transform="translate(2 2)"/>
    <rect x="-7" y="-48" width="14" height="65" rx="6.5" fill="url(#barrel)" stroke="#7f4c2a" stroke-width="1.4"/>
    <path d="M-5-43q1-4 5-4t5 4M-4.6-40v45" fill="none" stroke="#fff0c3" stroke-width="1.45" stroke-linecap="round"/>
    <rect x="-7.5" y="7" width="15" height="5.5" rx="1.5" fill="url(#frame)" stroke="#536675" stroke-width="1"/>
    <path d="M-6.2 13h12.4l-.8 8H-5.4Z" fill="#354956" stroke="#21323e" stroke-width="1.2"/>
    <path d="M-5.4 20.5h10.8l3.4 10.7C5.6 36.5 2.8 42.4 0 55.6-2.9 42.4-5.7 36.5-8.8 31.2Z" fill="url(#nib)" stroke="#634421" stroke-width="1.4"/>
    <path d="M0 54.4V34" fill="none" stroke="#795325" stroke-width="1.2"/>
    <circle cy="32.7" r="2" fill="#76552e"/>
    <path d="m-5.1 32.7 3.7 8m6.4-8-3.2 7.1" fill="none" stroke="#a67b38" stroke-width=".9" stroke-linecap="round"/>
  </g>
</svg>
